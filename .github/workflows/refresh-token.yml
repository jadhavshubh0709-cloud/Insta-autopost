name: Refresh Instagram token

# Long-lived Instagram tokens expire after 60 days. This refreshes it every 2 weeks
# and saves the new token back into the IG_ACCESS_TOKEN secret.
# Needs a secret GH_PAT: a fine-grained GitHub token for this repo with "Secrets: Read and write".

on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store token
        env:
          OLD_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${OLD_TOKEN}" | jq -r .access_token)
          if [ -z "$NEW" ] || [ "$NEW" = "null" ]; then echo "Refresh failed"; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
          echo "Token refreshed."
